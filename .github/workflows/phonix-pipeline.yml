name: Phonix Agent Pipeline

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  # ── ISSUE TRACK ────────────────────────────────────────────────────────────

  # Epic issue labeled 'next' → issue-creator creates the next sub-issue (including internal validation loop)
  run-issue-creator:
    if: github.event_name == 'issues' && github.event.label.name == 'next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Verify epic label and run issue-creator
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          LABELS=$(gh issue view $ISSUE_NUMBER --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "epic"; then
            claude --model claude-sonnet-4-6 --dangerously-skip-permissions --print \
              "Issue #${ISSUE_NUMBER} (epic) has been labeled 'next'. $(cat .claude/routines/issue-creator.md)"
          else
            echo "Skipping: Issue #${ISSUE_NUMBER} does not have the 'epic' label"
          fi

  # Issue labeled 'user:needs-clarification' → issue-creator addresses feedback (including internal validation loop)
  run-issue-creator-user-feedback:
    if: github.event_name == 'issues' && github.event.label.name == 'user:needs-clarification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run issue-creator (user feedback mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          claude --model claude-sonnet-4-6 --dangerously-skip-permissions --print \
            "Issue #${ISSUE_NUMBER} has been labeled user:needs-clarification — the user has feedback. $(cat .claude/routines/issue-creator.md)"

  # ── PR TRACK ───────────────────────────────────────────────────────────────

  # Issue labeled 'approved' → implementer branches, implements, and self-reviews (including internal review loop)
  run-implementer:
    if: github.event_name == 'issues' && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Configure git
        run: |
          git config --global user.email "phonix-agent@users.noreply.github.com"
          git config --global user.name "Phonix Agent"
      - name: Run implementer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          claude --model claude-sonnet-4-6 --dangerously-skip-permissions --print \
            "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE} has been approved. $(cat .claude/routines/implementer.md)"

  # PR labeled 'user:needs-clarification' → implementer addresses feedback and self-reviews
  run-implementer-user-feedback:
    if: github.event_name == 'pull_request' && github.event.label.name == 'user:needs-clarification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Configure git
        run: |
          git config --global user.email "phonix-agent@users.noreply.github.com"
          git config --global user.name "Phonix Agent"
      - name: Run implementer (user feedback mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude --model claude-sonnet-4-6 --dangerously-skip-permissions --print \
            "PR #${PR_NUMBER} has been labeled user:needs-clarification — the user has feedback. $(cat .claude/routines/implementer.md)"
