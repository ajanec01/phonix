name: Phonix Agent Pipeline

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

# Shared step definitions via reusable env
env:
  NODE_VERSION: '20'

jobs:
  # ── ISSUE TRACK ────────────────────────────────────────────────────────────

  # Issue labeled 'needs-validation' → validator reviews immediately
  run-issue-validator:
    if: github.event_name == 'issues' && github.event.label.name == 'needs-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run phonix-issue-validator
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          claude --dangerously-skip-permissions --print \
            "Issue #${ISSUE_NUMBER} has been labeled needs-validation. $(cat .claude/routines/issue-validator.md)"

  # Issue labeled 'user:needs-clarification' → creator revises to address user feedback
  run-issue-creator-on-user-clarification:
    if: github.event_name == 'issues' && github.event.label.name == 'user:needs-clarification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run phonix-issue-creator (user feedback mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          claude --dangerously-skip-permissions --print \
            "Issue #${ISSUE_NUMBER} has been labeled user:needs-clarification — the user has feedback. $(cat .claude/routines/issue-creator.md)"

  # Issue labeled 'agent:issue-revision' → creator reads concerns and fixes the issue
  run-issue-creator-on-revision:
    if: github.event_name == 'issues' && github.event.label.name == 'agent:issue-revision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run phonix-issue-creator (revision mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          claude --dangerously-skip-permissions --print \
            "Issue #${ISSUE_NUMBER} has been labeled agent:issue-revision — the validator has raised concerns. $(cat .claude/routines/issue-creator.md)"

  # Issue labeled 'approved' → implementer branches and implements
  run-implementer:
    if: github.event_name == 'issues' && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Configure git
        run: |
          git config --global user.email "phonix-agent@users.noreply.github.com"
          git config --global user.name "Phonix Agent"
      - name: Run phonix-implementer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          claude --dangerously-skip-permissions --print \
            "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE} has been approved. $(cat .claude/routines/implementer.md)"

  # ── USER TRIGGER ──────────────────────────────────────────────────────────

  # Epic issue labeled 'next' → creator creates the next sub-issue from the checklist
  # Only triggers if the labeled issue also has the 'epic' label
  run-issue-creator-on-next:
    if: github.event_name == 'issues' && github.event.label.name == 'next'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Verify issue has 'epic' label and run creator
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          LABELS=$(gh issue view $ISSUE_NUMBER --json labels -q '.labels[].name')
          if echo "$LABELS" | grep -q "epic"; then
            claude --dangerously-skip-permissions --print \
              "Issue #${ISSUE_NUMBER} (epic) has been labeled 'next' by the owner. $(cat .claude/routines/issue-creator.md)"
          else
            echo "Skipping: Issue #${ISSUE_NUMBER} does not have the 'epic' label"
          fi

  # ── PR TRACK ───────────────────────────────────────────────────────────────

  # PR labeled 'needs-peer-review' → reviewer fires immediately
  run-pr-reviewer:
    if: github.event_name == 'pull_request' && github.event.label.name == 'needs-peer-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run phonix-pr-reviewer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude --dangerously-skip-permissions --print \
            "PR #${PR_NUMBER} has been labeled needs-peer-review. $(cat .claude/routines/pr-reviewer.md)"

  # PR labeled 'user:needs-changes' → implementer reads user feedback and makes changes
  run-implementer-on-user-feedback:
    if: github.event_name == 'pull_request' && github.event.label.name == 'user:needs-changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Configure git
        run: |
          git config --global user.email "phonix-agent@users.noreply.github.com"
          git config --global user.name "Phonix Agent"
      - name: Run phonix-implementer (user feedback mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude --dangerously-skip-permissions --print \
            "PR #${PR_NUMBER} has been labeled user:needs-changes — the user has feedback. $(cat .claude/routines/implementer.md)"

  # PR labeled 'agent:pr-revision' → implementer reads concerns and pushes fixes
  run-implementer-on-pr-revision:
    if: github.event_name == 'pull_request' && github.event.label.name == 'agent:pr-revision'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Configure git
        run: |
          git config --global user.email "phonix-agent@users.noreply.github.com"
          git config --global user.name "Phonix Agent"
      - name: Run phonix-implementer (revision mode)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude --dangerously-skip-permissions --print \
            "PR #${PR_NUMBER} has been labeled agent:pr-revision — the reviewer has raised concerns. $(cat .claude/routines/implementer.md)"
